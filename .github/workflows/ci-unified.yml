name: Full Stack CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Detect changes to determine which pipelines to run
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'automotive-backend/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/ci-unified.yml'
            frontend:
              - 'automotive-frontend/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/ci-unified.yml'

  # Trigger backend pipeline
  backend-pipeline:
    name: Backend Pipeline
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit

  # Trigger frontend pipeline
  frontend-pipeline:
    name: Frontend Pipeline
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  # Final summary
  ci-complete:
    name: CI Pipeline Complete
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-pipeline, frontend-pipeline]
    if: always() && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true')
    
    steps:
    - name: Check pipeline results
      run: |
        echo "## Full Stack CI Results 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Changes Detected | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|------------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend | ${{ needs.detect-changes.outputs.backend }} | ${{ needs.backend-pipeline.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend | ${{ needs.detect-changes.outputs.frontend }} | ${{ needs.frontend-pipeline.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
        
        # Fail if any pipeline failed
        if [ "${{ needs.backend-pipeline.result }}" == "failure" ] || [ "${{ needs.frontend-pipeline.result }}" == "failure" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ One or more pipelines failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All pipelines completed successfully!" >> $GITHUB_STEP_SUMMARY
