name: CI Pipeline [DEPRECIATED]

on:
  #push:
  #  branches: [ main, develop, feature/** ]
  #pull_request:
  #  branches: [ main, develop, feature/** ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./automotive-backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      working-directory: ./automotive-backend
      run: |
        ruff check src/ tests/
      continue-on-error: false

    - name: Run tests with coverage
      working-directory: ./automotive-backend
      run: |
        # Remove old database files to ensure fresh schema
        rm -f maintenance.db test_maintenance.db test_status_integration.db
        pytest --cov=src --cov-report=term-missing --cov-report=html

    - name: Check coverage threshold
      working-directory: ./automotive-backend
      run: |
        pytest --cov=src --cov-fail-under=70

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: automotive-backend/htmlcov/
