name: Frontend CI Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'automotive-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop, feature/** ]
    paths:
      - 'automotive-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  COVERAGE_THRESHOLD: 70

jobs:
  # Code quality checks
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: automotive-frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./automotive-frontend
      run: npm ci

    - name: Lint with ESLint
      working-directory: ./automotive-frontend
      run: npm run lint

    - name: Check code formatting with Prettier
      working-directory: ./automotive-frontend
      run: npm run format:check

    - name: TypeScript type checking
      working-directory: ./automotive-frontend
      run: npx tsc --noEmit

  # Unit and integration tests
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: [code-quality]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: automotive-frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./automotive-frontend
      run: npm ci

    - name: Run tests with coverage
      working-directory: ./automotive-frontend
      run: npm run test:coverage -- --coverage.thresholds.lines=${{ env.COVERAGE_THRESHOLD }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./automotive-frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
      continue-on-error: true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-results
        path: |
          automotive-frontend/coverage/
        retention-days: 30

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: davelosert/vitest-coverage-report-action@v2
      with:
        working-directory: ./automotive-frontend
      continue-on-error: true

  # Build validation
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: automotive-frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./automotive-frontend
      run: npm ci

    - name: Build production bundle
      working-directory: ./automotive-frontend
      run: npm run build

    - name: Check build size
      working-directory: ./automotive-frontend
      run: |
        BUILD_SIZE=$(du -sh dist | cut -f1)
        echo "Build size: $BUILD_SIZE"
        echo "## Build Metrics 📦" >> $GITHUB_STEP_SUMMARY
        echo "- Bundle size: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: automotive-frontend/dist/
        retention-days: 7

  # Docker build (optional)
  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Check for Dockerfile
      id: check-dockerfile
      working-directory: ./automotive-frontend
      run: |
        if [ -f Dockerfile ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build Docker image
      if: steps.check-dockerfile.outputs.exists == 'true'
      working-directory: ./automotive-frontend
      run: |
        docker build -t automotive-frontend:${{ github.sha }} .
        docker tag automotive-frontend:${{ github.sha }} automotive-frontend:latest

    - name: Test Docker image
      if: steps.check-dockerfile.outputs.exists == 'true'
      run: |
        docker run -d --name test-frontend -p 3000:80 automotive-frontend:${{ github.sha }}
        sleep 5
        docker ps | grep test-frontend
        docker stop test-frontend
        docker rm test-frontend

    - name: Inspect image size
      if: steps.check-dockerfile.outputs.exists == 'true'
      run: |
        docker images automotive-frontend:${{ github.sha }} --format "Image size: {{.Size}}"

    - name: Skip Docker build
      if: steps.check-dockerfile.outputs.exists == 'false'
      run: echo "No Dockerfile found, skipping Docker build"

  # Summary job
  frontend-ci-success:
    name: Frontend CI Success
    runs-on: ubuntu-latest
    needs: [code-quality, test, build, docker-build]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        if [ "${{ needs.code-quality.result }}" != "success" ] || \
           [ "${{ needs.test.result }}" != "success" ] || \
           [ "${{ needs.build.result }}" != "success" ] || \
           ([ "${{ needs.docker-build.result }}" != "success" ] && [ "${{ needs.docker-build.result }}" != "skipped" ]); then
          echo "❌ One or more frontend CI jobs failed"
          exit 1
        fi
        echo "✅ All frontend CI jobs passed successfully!"

    - name: Post summary
      run: |
        echo "## Frontend CI Pipeline Results ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests & Coverage | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
